databases:
  - name: agriconnect-db
    databaseName: agriconnect
    plan: free            # if Render rejects this plan name, pick a paid Postgres plan in the dashboard

services:
  - type: web
    name: agriconnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL            # connected automatically to the database above
        fromDatabase:
          name: agriconnect-db
          property: connectionString
      - key: JWT_SECRET              # generated for you
        generateValue: true
      - key: CLIENT_ORIGIN           # set to your frontend URL after first deploy
        sync: false
      - key: ADMIN_EMAIL             # your admin login (created on first start)
        sync: false
      - key: ADMIN_PASSWORD          # choose a strong password
        sync: false
      - key: ANTHROPIC_API_KEY       # optional: leave empty and the AI page shows 'coming soon'
        sync: false
      - key: PAYSTACK_SECRET_KEY     # your Paystack secret key: gives each investor and buyer a personal account number
        sync: false
      - key: PAYSTACK_DVA_BANK       # ignored for test keys (they always use test-bank); wema-bank or titan-paystack when live
        value: wema-bank
      - key: KYC_ENCRYPTION_KEY      # encrypts BVN/ID numbers; generated once, never change it
        generateValue: true
      - key: RESEND_API_KEY          # optional: sends forgot-password emails (resend.com)
        sync: false
      - key: MAIL_FROM               # must be on a domain you verified in Resend
        value: "AgriConnect <notification@agriconnect.com>"
      - key: CONTACT_EMAIL           # where the website's contact form is delivered; also the reply-to of every notification
        value: contact@agriconnect.com
      - key: R2_ACCOUNT_ID           # Cloudflare R2 photo storage (all optional; empty = photos kept in Postgres)
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  - type: web
    name: agriconnect-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL            # your API URL, no trailing slash
        sync: false
